[pytest]
# Phase 1 test suite.
#
# The real HAI recording is 280,800 + 54,000 rows, loaded ONCE per session by the
# fixtures in tests/conftest.py. `-p no:randomly` is deliberate: several tests
# assert on measured values from the real files, and reordering them changes
# nothing, but the session fixtures make ordering irrelevant anyway.
#
# Markers:
#   slow  -- hashes ~360 MB of raw data to verify immutability. Included by
#            default; deselect with `-m "not slow"` for a fast inner loop.

testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers --strict-config --tb=short
markers =
    slow: verifies raw-file checksums; reads ~360 MB from disk
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
