# =============================================================================
# default.yaml — BASE CONFIGURATION
# Drift-Aware Adaptive Edge-Cloud-Hybrid Orchestration for Non-Stationary IoT
# =============================================================================
#
# This is the single source of truth for all Phase 1 parameters. The scenario
# files (sudden_drift.yaml, gradual_drift.yaml, stress_test.yaml) inherit from
# this file via `_extends` and override ONLY what differs. Never copy this file
# to make a variant -- duplicated values drift apart and silently make
# experiments non-comparable.
#
# CONVENTIONS USED THROUGHOUT
#   ASSUMPTION [An] : a value not yet scientifically fixed. Documented,
#                     configurable, and intended to be justified by a
#                     sensitivity experiment. Never treated as settled fact.
#   VERIFY          : a value re-measured from the configured baseline file at
#                     load time rather than trusted from this file.
#   VERIFIED        : a value measured directly from the raw HAI files during
#                     the Step 2 transition. Fact, not assumption.
#   LEAKAGE         : a rule that exists specifically to prevent data leakage.
#
# This file is inert data. It contains NO later-phase parameters (WDS weights,
# LRI budgets, model hyperparameters). Those are deliberately absent rather
# than guessed -- see section `reserved_for_later_phases` at the end.
# =============================================================================

meta:
  name: default
  description: >
    Phase 10 baseline on WUSTL-IIoT-2021 (active dataset per Decision D-020).
    Flow-level industrial IoT network event stream with embedded ground-truth targets.
  phase: 10
  config_version: 2

# -----------------------------------------------------------------------------
# 1. REPRODUCIBILITY
# -----------------------------------------------------------------------------
reproducibility:
  # Master seed. Every stochastic component derives a sub-seed from this so that
  # changing one component's randomness does not perturb the others.
  random_seed: 42

  # Multi-seed protocol for statistical evaluation. Used in later phases; listed
  # here so the seed set is fixed BEFORE any results are seen (prevents
  # post-hoc seed cherry-picking).
  seeds: [42, 123, 456, 789, 2024]

  # Fail loudly rather than silently producing non-reproducible runs.
  strict: true

# -----------------------------------------------------------------------------
# 2. DATASET
# -----------------------------------------------------------------------------
dataset:
  # mode: csv  -> generic chronological delimited file (WUSTL-IIoT-2021)
  mode: csv

  # --- ACTIVE DATASET IDENTIFICATION (Decision D-020) -----------------------
  # Active dataset: WUSTL-IIoT-2021 (wustl_iiot_2021.csv, 409,800,698 bytes).
  # 37 network flow features, flow-level chronological stream.
  # Historical provenance: Earlier phases 1-1b initially prepared HAI 23.05 before
  # the formal migration to WUSTL-IIoT-2021 in Phase 2/Decision D-020.
  active_dataset: "WUSTL-IIoT-2021"
  stream_semantics: "flow_level"

  # --- Files and ROLES -----------------------------------------------------
  # Roles are declared HERE, never hard-coded in Python.
  # Raw files are byte-identical copies of the originals and are never modified.
  files:
    train1:
      path: data/raw/wustl_iiot_2021.csv
      role: baseline_train
      description: "Causal WUSTL flow-level training partition."
      rows: 304166
      selection_time_range: ["2019-08-19 09:46:03", "2019-08-19 11:29:48"]
      time_range: ["2019-08-19 09:46:03", "2019-08-19 11:29:48"]
    train2:
      path: data/raw/wustl_iiot_2021.csv
      role: baseline_validation
      description: "Causal WUSTL validation partition; never used for fitting."
      rows: 265685
      selection_time_range: ["2019-08-19 11:29:49", "2019-08-19 13:07:36"]
      time_range: ["2019-08-19 11:29:49", "2019-08-19 13:07:36"]
    test1:
      path: data/raw/wustl_iiot_2021.csv
      role: inference_stream
      description: "Causal WUSTL test/inference partition."
      rows: 624613
      selection_time_range: ["2019-08-19 13:07:37", "2019-08-19 16:48:11"]
      time_range: ["2019-08-19 13:07:37", "2019-08-19 16:48:11"]

  # --- OFFICIAL LABEL SIDECARS ---------------------------------------------
  # Deliberately NOT entries in `dataset.files`. That section is the set of
  # PROCESS-VALUE streams and loader.file_specs enforces its contract: exactly
  # one file with role `inference_stream`, every other entry a baseline
  # candidate. A label sidecar listed there could be selected as a baseline and
  # normalised as if it were process data. A label file is a different kind of
  # object, so it gets a different section.
  #
  # LEAKAGE: evaluation-only. See the OFFICIAL-LABEL QUARANTINE block below.
  # For WUSTL-IIoT-2021, ground truth targets are embedded in the dataset itself
  # (Target column). No external label sidecar is required.
  labels: {}

  # --- RESERVED, NOT REACHABLE BY THE LOADER --------------------------------
  # Declared for provenance and chronology only. These keys are NOT in
  # `dataset.files` and NOT in `dataset.labels`, so no loader code path can
  # select them. Making test2 unreachable structurally is stronger than an
  # `active: false` flag that someone could flip without reading why.
  #
  # test2 is chronologically the LATEST stream, so it is causally after train1,
  # test1 and train2 and would admit a larger legitimate baseline. It is still
  # not the first experiment, for the measured reason recorded on label_test2
  # and in PROVENANCE.json (finding_label_test2_minute_resolution).
  reserved_files:
    test2:
      path: data/raw/hai-test2.txt
      intended_role: second_inference_stream
      rows: 230400                 # VERIFIED
      time_range: ["2022-08-17 00:00:01", "2022-08-19 16:00:00"]
      status: reserved
    label_test2:
      path: data/raw/label-test2.txt
      intended_role: second_inference_labels
      rows: 230400                 # VERIFIED
      time_range: ["2022-08-17 00:00:00", "2022-08-19 16:00:00"]
      label_column: label
      classes: [0, 1]
      class_distribution: {0: 221997, 1: 8403}
      positive_rate: 0.036471
      positive_episodes: 38
      # MEASURED DEFECT 2026-08-27 by audit_alignment.py, only 3/6 checks pass:
      #   row count matches test2 exactly (230,400); 0 missing labels;
      #   2 classes {0, 1}.
      #   BUT its timestamp column is MINUTE-resolution, textually formatted
      #   '2022-08-17 0:00' rather than '2022-08-17 00:00:01'. Only 3,841
      #   distinct stamps cover 230,400 rows, i.e. 226,559 duplicates, so the
      #   stamp is not a joinable key against a 1 Hz stream. Elementwise
      #   comparison disagrees on 226,560 of 230,400 rows, and the label file
      #   starts at 00:00:00 while test2 starts at 00:00:01.
      #   Positional (row-order) alignment is plausible but UNVERIFIABLE from
      #   the timestamps, and assuming it would silently offset every label by
      #   up to 60 s. Not repaired, not assumed. Reported and left unreachable.
      alignment: not_verifiable_minute_resolution
      status: reserved_blocked_by_finding

  # Files are kept SEPARATE. Concatenation would create an artificial regime
  # change at the seam and confound the injected drift.
  concatenate_files: false

  # --- CAUSALITY WARNING (VERIFIED, blocks a naive train1+train2 baseline) ---
  # RE-MEASURED 2026-08-27 across the complete HAI 23.05 file set, including
  # test2. The order is NOT the order implied by the filenames:
  #
  #   True chronological order is:  train1 < test1 < train2 < test2
  #     train1 : 2022-08-04 18:00:01 -> 08-08 00:00:00   (78.0 h, 280,800 rows)
  #     test1  : 2022-08-12 16:00:01 -> 08-13 07:00:00   (15.0 h,  54,000 rows)
  #     train2 : 2022-08-13 07:00:01 -> 08-16 16:00:00   (81.0 h, 291,600 rows)
  #     test2  : 2022-08-17 00:00:01 -> 08-19 16:00:00   (64.0 h, 230,400 rows)
  #
  # train2 lies ENTIRELY IN THE FUTURE relative to test1. Fitting the baseline
  # on train1+train2 and then inferring on test1 would use data unavailable at
  # inference time -- acausal, and a direct violation of the no-leakage rule.
  # The naive "both training files are training data" reading is therefore
  # wrong, and adding test2 to the audit did not change that: train1 remains
  # the ONLY file causally prior to test1.
  #
  # baseline_source controls this and defaults to the causal choice:
  #   train1_only        : causal. train1 precedes test1. DEFAULT.
  #   train1_and_train2  : NOT causal for test1. Ablation/reference use only.
  baseline_source: train1_only     # ASSUMPTION [A17]
  allow_acausal_baseline: false    # guard: setting baseline_source to
                                   # train1_and_train2 requires flipping this
                                   # flag explicitly and knowingly

  # --- Header / parsing ----------------------------------------------------
  # VERIFIED: comma-separated despite the .txt extension; clean header with no
  # padding whitespace. Stripping is kept enabled as a harmless safeguard.
  format: csv
  delimiter: ","
  strip_column_whitespace: true
  strip_value_whitespace: true

  # --- Time ----------------------------------------------------------------
  stream_semantics: flow_level
  window_unit: observations
  timestamp_column: "StartTime"
  timestamp_format: "%Y-%m-%d %H:%M:%S"
  expected_sampling_interval_s: 0

  require_monotonic_timestamps: true
  ordering:
    sort_by_timestamp: true
    tie_breaker_columns: [SrcAddr, DstAddr, Sport, Dport, Proto, sIpId, dIpId]
  max_gap_s_before_new_block: 60

  # --- Target --------------------------------------------------------------
  # HISTORY (preserved, superseded 2026-08-27):
  #   The three process-value files supplied on 2026-08-25 contained NO
  #   label/attack/anomaly column. All 87 columns were identical across
  #   train1, train2 and test1 (timestamp + 86 process variables). No label was
  #   fabricated; label_column was null and task was 'unresolved' pending a
  #   user decision. That finding was correct about those files and remains on
  #   record as finding_no_label_column.
  #
  #   ASSUMPTION [A1-HAI]: SUPERSEDED. The SWaT binary label assumption does
  #   not transfer to these files.
  #
  # RESOLVED 2026-08-27, by the user, using the OFFICIAL label files that the
  # HAI 23.05 release ships separately from the process values. The label is
  # therefore READ FROM THE DISTRIBUTION, not derived, not inferred from
  # process values, and not fabricated. Option taken:
  # 'labels_from_hai_labels' -- the one option that preserves the
  # specification's primary metric, post-drift Macro-F1.
  #
  # VERIFIED before resolving (audit_alignment.py, 6/6 on test1):
  #   binary {0, 1}, 0 missing, 54,000 labels for 54,000 rows, timestamps equal
  #   elementwise row-for-row, label stamps unique.
  task: supervised_classification
  label_column: null
  # 0 = normal operation, 1 = attack. These are the file's own values, read from
  # it, not a mapping we chose.
  label_map: {0: normal, 1: attack}
  positive_class: 1
  min_required_classes: 2
  # Official HAI label file for the ACTIVE inference stream (test1).
  # EVALUATION-ONLY ground truth; never an inference-time input.
  label_file: null
  # No column of the process-value files is the target: the target lives in a
  # separate file. target_column stays null on purpose -- setting it would
  # imply a process channel is being predicted.
  target_column: Target

  # --- OFFICIAL-LABEL QUARANTINE -------------------------------------------
  # LEAKAGE: the official attack labels are evaluation metadata. Exposing them
  # to anything that runs at inference time would turn anomaly detection into
  # reading the answer key.
  #
  # These labels are kept STRICTLY SEPARATE from the controlled synthetic-drift
  # ground truth (see section 6, `ground_truth`). Two different objects:
  #   official HAI labels  -> what the plant actually did; from the release.
  #   drift ground truth   -> what WE injected; scenario, onset, magnitude, seed.
  # They must never be merged, and neither may reach a model or detector.
  label_usage: training_and_evaluation
  label_forbidden_consumers:
    [models, drift_detectors, severity, persistence, reliability, controller,
     wds, lri, edge, cloud, hybrid, adaptation, preprocessing]
  label_allowed_consumers: [metrics, plots, statistical_evaluation]

  # --- CONSEQUENCE OF RESOLVING THIS WAY (open, Phase 2 decision) ----------
  # MEASURED: the HAI 23.05 release ships label files for the TEST streams
  # only. There is no label file for train1 or train2, so the causal baseline
  # (train1) carries NO labels.
  #
  # A supervised two-class classifier therefore cannot be fitted on train1 with
  # official labels, and assigning label=0 to every training row would be
  # FABRICATING LABELS -- forbidden. HAI's documented design intent is that the
  # training files are attack-free normal operation, but that is the
  # distribution's claim, not something measurable from files that ship no
  # labels.
  #
  # ASSUMPTION [A18]: train1 is treated as unlabelled, NOT as all-normal.
  # Whether the Edge/Cloud models are therefore one-class / reconstruction
  # detectors scored against these labels, or something else, is a Phase 2
  # model-design decision and is deliberately NOT taken here.
  training_labels_available: true
  training_labels_assumption: null

  # --- Feature selection ---------------------------------------------------
  features:
    # null = every column except timestamp/label/target, minus exclusions.
    include: null
    exclude: [Target, Traffic, StartTime, LastTime, RunTime, SrcAddr, DstAddr, Sport, Dport, Proto, sIpId, dIpId]

    # Zero-variance columns carry no information. Dropped by CONFIG, never by a
    # hard-coded drop in source.
    #
    # LEAKAGE: variance is computed on the baseline segment ONLY, never on the
    # whole stream.
    drop_zero_variance: true

    # Measured on train1: 0 columns are zero-variance.
    known_zero_variance_all_files: []

    command_feedback_pairs: {}
    exclude_target_sibling: false

    # Process groups: not applicable to network flow features
    process_group_prefixes: []

    # Column type groups. Critical for drift injection: a continuous offset
    # applied to a discrete state variable produces physically impossible
    # values. Auto-detected by cardinality, with an override hook.
    # VERIFIED on train1: 28 columns <=10 unique values, 58 columns >10.
    type_detection:
      method: cardinality          # cardinality | explicit
      discrete_max_cardinality: 10 # <= this many unique values => discrete
      explicit_continuous: null
      explicit_discrete: null

# -----------------------------------------------------------------------------
# 3. STREAM SEGMENTATION
# -----------------------------------------------------------------------------
# The stream is split chronologically. There is NO random splitting anywhere in
# this project.
#
# HAI DIFFERS STRUCTURALLY FROM SWaT HERE. SWaT was one file, so the baseline
# had to be a leading fraction of it. HAI supplies a physically separate
# baseline file (train1), which is strictly better: the inference stream
# (test1) need not be consumed to establish the baseline, so the full 54,000
# rows remain available for drift injection and evaluation.
split:
  # Where baseline statistics and (later) initial models come from.
  #   separate_file  : use dataset.baseline_source (train1). DEFAULT for HAI.
  #   leading_fraction: carve the leading fraction out of the inference stream.
  #                     Retained for single-file datasets and as an ablation.
  mode: separate_file

  # Only used when mode: leading_fraction.
  # ASSUMPTION [A2]: 30%. Sensitivity experiment planned.
  baseline_fraction: 0.30

  # Guard: drift must never be injected inside the baseline. Under HAI's
  # separate_file mode this holds by construction -- drift is injected into
  # test1, and the baseline is a different file entirely.
  enforce_drift_after_baseline: true

  # Optional cap on baseline rows, for fast smoke tests. null = use all.
  # NOTE: train1 is 280,800 rows at 1 Hz (78 h).
  max_baseline_rows: null

# -----------------------------------------------------------------------------
# 4. PREPROCESSING  (causal / online only)
# -----------------------------------------------------------------------------
preprocessing:

  # --- 4.1 Validation ------------------------------------------------------
  validation:
    enabled: true
    check_dtypes: true
    check_timestamp_monotonic: true
    check_missing_fields: true
    # WUSTL is a flow-level event stream: concurrent flows legitimately share
    # StartTime. They are ordered deterministically, not treated as bad rows.
    check_duplicate_timestamps: false
    # Physical range check. Bounds are LEARNED from the baseline segment, not
    # hard-coded, because true sensor ranges are process-specific.
    check_ranges: true
    range_source: baseline          # baseline | explicit | none
    range_tolerance_sigma: 6.0      # ASSUMPTION [A3]
    # A validation failure flags the sample; it does not silently delete it.
    on_failure: flag                # flag | drop | raise

  # --- 4.2 Missing values --------------------------------------------------
  missing:
    method: forward_fill            # forward_fill | interpolate | drop_window
    # Forward-fill is causal by construction (uses only past values).
    # Linear interpolation between t-1 and t+1 would use a FUTURE sample.
    # LEAKAGE: interpolation is therefore restricted to a backward-only form.
    interpolate_direction: backward_only
    max_consecutive_fill: 5         # ASSUMPTION [A4]
    # Never forward-fill across a block boundary (a multi-minute gap).
    respect_block_boundaries: true

  # --- 4.3 Outliers --------------------------------------------------------
  outliers:
    # CRITICAL SCIENTIFIC CONSTRAINT
    # Genuine drift produces unusual observations. Deleting them would erase
    # the very signal the experiment is designed to detect. Therefore the
    # DEFAULT ACTION IS `flag` -- annotate, keep the value, and let the drift
    # detector see it.
    method: iqr                     # iqr | zscore | domain | none
    action: flag                    # flag | clip | drop   <-- do not default to drop
    iqr_multiplier: 3.0             # ASSUMPTION [A5]: 3.0, wider than the
                                    # conventional 1.5, deliberately conservative
    zscore_threshold: 4.0           # ASSUMPTION [A5]
    # Statistics come from the baseline segment and are then FROZEN.
    # LEAKAGE: recomputing them over post-drift data would let the definition
    # of "outlier" absorb the drift.
    statistics_source: baseline_frozen
    apply_to: continuous_only       # discrete actuator states are never outliers

  # --- 4.4 Filtering -------------------------------------------------------
  filtering:
    enabled: false                  # off by default: smoothing can attenuate
                                    # the abrupt change that sudden drift creates
    method: moving_average          # moving_average | median | none
    window: 5
    causal: true                    # backward-looking only; a centred filter
                                    # would read future samples (LEAKAGE)

  # --- 4.5 Normalization ---------------------------------------------------
  normalization:
    enabled: true
    method: zscore                  # zscore | minmax | none

    # =========================================================================
    # THE MOST CONSEQUENTIAL PARAMETER IN PHASE 1 -- READ BEFORE CHANGING
    #
    # An online scaler that keeps adapting will ABSORB a mean-shift drift:
    # after enough samples the normalized stream looks unchanged, the Edge
    # model stops degrading, and ADWIN detects nothing. The drift becomes
    # invisible not because it is absent but because preprocessing cancelled it.
    #
    #   frozen_after_baseline : fit on the baseline segment, then freeze.
    #                           Causal (no future data), and preserves drift.
    #                           This is the default and the safe choice.
    #   running               : cumulative Welford. Causal but slowly absorbs
    #                           drift. Use only as a deliberate ablation.
    #   rolling               : fixed-window. Absorbs drift fastest.
    #
    # ASSUMPTION [A6]: frozen_after_baseline. To be justified by a sensitivity
    # experiment comparing all three adaptation modes.
    # =========================================================================
    adaptation: frozen_after_baseline
    rolling_window: 1000            # only used when adaptation: rolling
    epsilon: 1.0e-8                 # zero-variance guard

    # LEAKAGE (absolute): fitting on the full dataset is forbidden anywhere in
    # this project. Kept as an explicit flag so the prohibition is visible and
    # any violation is a config diff, not a hidden code change.
    forbid_global_fit: true

  # --- 4.6 Windowing -------------------------------------------------------
  windowing:
    # WUSTL flow-level stream: these are COUNTS OF FLOW OBSERVATIONS, never
    # seconds. Same-timestamp flows are retained as distinct observations.
    window_unit: observations
    window_size: 50
    step_size: 10

    # A window overlapping a data gap is not a valid 50 s observation.
    require_contiguous: true
    min_valid_fraction: 0.9         # ASSUMPTION [A8]

    # Recorded per window (specification requirement).
    record: [window_id, start_time, end_time, features, target]

    # Window label from its constituent samples.
    # ASSUMPTION [A9]: `any_positive` -- a window containing any attack sample
    # is an attack window. Appropriate for anomaly detection, where a short
    # attack inside a window still matters. Alternative: `majority`, or `last`.
    label_aggregation: any_positive

    # Features extracted per window per continuous channel.
    feature_extraction:
      continuous: [mean, std, min, max, last, slope]
      # For discrete actuators, distributional summaries are meaningless;
      # mode and change-count are the interpretable choices.
      discrete: [mode, n_changes]

# -----------------------------------------------------------------------------
# 5. DRIFT INJECTION
# -----------------------------------------------------------------------------
# generator.py applies CONTROLLED SYNTHETIC DRIFT TO REAL HAI OBSERVATIONS.
# It never fabricates a replacement dataset. Drift is injected into the
# inference stream (test1) only -- never into the baseline file.
drift:
  # none | sudden | gradual | recurring | stress
  scenario: none

  # --- Position ------------------------------------------------------------
  # reference_stream fixes WHAT the fractions are fractions OF. Without this the
  # numbers in the scenario overlays are ambiguous now that baseline and
  # inference live in separate files.
  #
  # inference_stream : fraction of the file whose role is `inference_stream`
  #                    (dataset.files.test1 -> 54000 rows). 0.50 => row 27000.
  # post_baseline    : only meaningful when split.mode == leading_fraction,
  #                    where baseline and inference are one file.
  #
  # Drift is NEVER injected into the baseline file. See ASSUMPTION [A18].
  reference_stream: inference_stream   # inference_stream | post_baseline

  # ASSUMPTION [A18]: drift is injected into the inference stream ONLY. The
  # baseline file is left as recorded, so the deployed model is trained on
  # genuine undisturbed HAI behaviour and every post-baseline degradation is
  # attributable to the injected drift. The alternative -- perturbing the
  # baseline too -- would make "drift" unmeasurable, because the reference
  # distribution would move with it. Not a free choice, but recorded as an
  # assumption because it fixes the experiment's meaning of "drift".
  injection_target: inference_stream_only   # inference_stream_only
  #
  # start_fraction is preferred: it ports across datasets of different length.
  # If start_index is non-null it takes precedence.
  start_fraction: null
  start_index: null
  duration_fraction: null           # ramp/segment length, scenario-dependent
  end_fraction: null                # null => persists to end of stream

  # --- Magnitude -----------------------------------------------------------
  # Expressed in units of each feature's OWN baseline standard deviation.
  #
  # Why sigma units and not absolute units: HAI channels differ by orders of
  # magnitude (P1_FT02 ~ 2460, P1_PIT01 ~ 1.26, P1_PIT01_HH ~ 524320). An
  # absolute offset of 5.0 is negligible for one and catastrophic for another.
  # Sigma units make `magnitude` physically comparable across channels and
  # across datasets.
  #
  # LEAKAGE: sigma is computed on the BASELINE FILE only (train1), never on the
  # inference stream. Computing it over test1 would make the drift definition
  # itself depend on the data being evaluated.
  magnitude: 0.0                    # 0.0 => no drift (this control config)
  magnitude_units: baseline_sigma   # baseline_sigma | absolute | relative

  # --- Mechanism -----------------------------------------------------------
  # offset      : x' = x + m*sigma           (calibration/bias drift)
  # scale       : x' = x * (1 + m)           (gain degradation)
  # noise       : x' = x + N(0, (m*sigma)^2) (transmitter degradation)
  # correlation : rotate a feature pair      (changed process relationship)
  #
  # ASSUMPTION [A10]: `offset` is the default. It is the most physically
  # interpretable (sensor bias), monotone in magnitude, and does not alter the
  # label -- so it induces covariate shift without creating impossible data.
  mechanism: offset

  # --- Which channels are affected ----------------------------------------
  affected_features:
    # null => auto-select per the policy below
    explicit: null
    # auto policy: pick continuous sensors only, highest-variance first, so the
    # drift lands on informative channels rather than near-constant ones.
    selection: top_variance         # top_variance | random | all_continuous
    n_features: 5                   # ASSUMPTION [A11]
    # Discrete actuators are EXCLUDED from continuous mechanisms by default.
    # Applying a fractional offset to a 1/2 state is physically impossible.
    actuator_policy: exclude        # exclude | state_flip
    state_flip_probability: 0.0     # only used when actuator_policy: state_flip

  # --- Physical plausibility ----------------------------------------------
  # Prevents impossible values (negative flow, negative tank level).
  # TENSION, stated explicitly: clipping preserves plausibility but ATTENUATES
  # the injected drift. The generator must therefore report realised vs
  # requested magnitude so any attenuation is measured, not hidden.
  clip_to_physical_range: true
  physical_range_source: baseline   # baseline | explicit
  physical_range_expansion: 1.5     # ASSUMPTION [A12]: allow 1.5x the baseline
                                    # observed range before clipping
  report_realised_magnitude: true

  # --- Recurring-scenario controls (unused unless scenario: recurring) -----
  recurring:
    period_fraction: 0.15           # length of each A or B segment
    n_cycles: 2                     # A -> B -> A -> B

  # --- Stress-scenario controls (unused unless scenario: stress) -----------
  stress:
    progressive: true               # magnitude ramps monotonically to `magnitude`
    steps: 5

  # --- Labels --------------------------------------------------------------
  # ASSUMPTION [A13]: labels are NEVER modified. Drift is injected in feature
  # space only. Relabelling risks producing semantically impossible records
  # (an "attack" label on physically normal process behaviour), which the
  # specification forbids. True concept drift (a change in P(y|x)) is reserved
  # for the `correlation` mechanism, which alters feature relationships without
  # touching y.
  modify_labels: false

  # --- Phase 3 Drift Detection ---------------------------------------------
  detection:
    adwin:
      delta: 0.002           # ADWIN statistical confidence parameter
      clock: 32              # check frequency (observations per check)
      max_buckets: 5         # ADWIN bucket count
      min_window_length: 5   # minimum observations before split check
      grace_period: 10       # minimum warmup observations
      monitored_signal: prediction_probability # prediction_probability (default) | uncertainty | prediction | prediction_error
    persistence:
      criterion: consecutive # consecutive | windowed_count
      consecutive_threshold: 3 # K consecutive detections for persistence
      window_size: 10        # T window observations (for windowed_count)
      count_threshold: 3     # N detections in T (for windowed_count)
    severity:
      formula: relative_shift # relative_shift: D = min(1.0, abs(current_shift - baseline_mean) / max_shift)
      baseline_mean: null    # null => computed causally from baseline_train
      max_shift: null        # null => defaults to max(1.0 - baseline_mean, 1e-6)
      smoothing_factor: 0.8  # EMA factor for smoothed_severity (0.0 = no smoothing)
    reliability:
      alpha_E: 0.8           # EMA smoothing factor for prediction error E_t
      epsilon: 1.0e-8        # Numerical stability epsilon for harmonic mean
      initial_error: 0.0     # Initial E_0 prior to ground-truth feedback
      weights:
        confidence: 0.25     # w_C
        error: 0.25          # w_E
        drift: 0.25          # w_D
        quality: 0.25        # w_Q
      default_n_features: 37 # N_F feature count for quality Q_t normalization

# -----------------------------------------------------------------------------
# 5b. DECISION ENGINE (PHASE 5)
# -----------------------------------------------------------------------------
decision:
  adaptive:
    initial_action: EDGE
    cloud_threshold: 0.50
    edge_return_threshold: 0.70
    critical_cloud_threshold: 0.30
    transition_mode: tiered

  hybrid:
    enabled: true
    fallback_confidence_threshold: 0.60
    fallback_on_uncertainty: true

  baseline:
    policy: edge_only
    ratio: 0.5

  instrumentation:
    enabled: true
    max_records: 10000

# -----------------------------------------------------------------------------
# 5c. HARDENED EXECUTION LAYER (PHASE 6)
# -----------------------------------------------------------------------------
execution:
  validation:
    enabled: true
    check_finite: true
    check_probabilities: true

  timing:
    enabled: true
    timer: perf_counter

  telemetry:
    enabled: true
    max_records: 10000

  failure:
    edge_policy: fail
    cloud_policy: fail
    hybrid_cloud_failure_policy: fail

# -----------------------------------------------------------------------------
# 5d. MODEL MANAGEMENT & MONITORING (PHASE 7)
# -----------------------------------------------------------------------------
monitoring:
  enabled: true
  max_records: 10000
  model_management: true
  reliability: true
  drift: true
  decisions: true
  execution: true
  alerts:
    reliability_degraded_threshold: 0.50
    drift_active_threshold: 0.10

# -----------------------------------------------------------------------------
# 5e. EDGE-CLOUD DEPLOYMENT & NETWORK EXECUTION (PHASE 8)
# -----------------------------------------------------------------------------
network:
  enabled: true
  mode: simulation

  latency:
    base_s: 0.020
    jitter_s: 0.005

  packet_loss:
    probability: 0.0

  availability:
    edge: true
    cloud: true
    network: true

  deterministic:
    enabled: true
    seed: 42

  pacing_enabled: false

# -----------------------------------------------------------------------------
# 5f. MODEL ADAPTATION & RETRAINING (PHASE 9)
# -----------------------------------------------------------------------------
adaptation:
  enabled: true
  mode: simulation

  trigger:
    require_persistent_drift: true
    min_severity: 0.30
    min_feedback_samples: 50

  cooldown:
    steps: 100

  training:
    max_feedback_samples: 1000
    baseline_sample_size: 500
    random_seed: 42
    cloud_model:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1

  validation:
    enabled: true
    metric: macro_f1
    minimum_metric: 0.70
    max_regression_margin: 0.05

  deployment:
    enabled: true
    atomic: true
    mode: simulation

# -----------------------------------------------------------------------------
# 6. GROUND TRUTH  (EVALUATION ONLY -- QUARANTINED)
# -----------------------------------------------------------------------------
# The generator knows the true drift onset because it created it. That
# knowledge is required to measure detection delay, and is forbidden everywhere
# else.
ground_truth:
  # Written to a sidecar file, never into the feature stream.
  emit_sidecar: true
  sidecar_path: data/synthetic/ground_truth.json
  fields:
    [scenario, drift_start_index, drift_end_index, affected_features,
     drift_magnitude, realised_magnitude, mechanism, random_seed]

  # Hard architectural boundary. Any component listed here that reads ground
  # truth is a leakage defect.
  forbidden_consumers:
    [models, drift_detectors, severity, persistence, reliability, controller,
     wds, lri, edge, cloud, hybrid, adaptation]
  allowed_consumers: [metrics, plots, statistical_evaluation]

# -----------------------------------------------------------------------------
# 7. STREAMING
# -----------------------------------------------------------------------------
streaming:
  shuffle: false                    # must remain false; ADWIN requires order
  # null => stream the whole file. An integer truncates for fast smoke tests.
  max_samples: null
  emit: windows                     # windows | samples | both
  # Simulated wall-clock pacing is a later-phase (SimPy) concern. Phase 1
  # streams as fast as it can while preserving order.
  realtime_factor: null

# -----------------------------------------------------------------------------
# 8. OUTPUT
# -----------------------------------------------------------------------------
output:
  results_dir: results
  plots_dir: plots
  processed_dir: data/processed
  synthetic_dir: data/synthetic
  log_level: INFO                   # DEBUG | INFO | WARNING | ERROR
  # Persist the fully-resolved config (after _extends merging) beside the
  # results so any run can be reproduced exactly.
  save_resolved_config: true

# -----------------------------------------------------------------------------
# 9. RESERVED FOR LATER PHASES
# -----------------------------------------------------------------------------
# These sections are intentionally EMPTY. Several of their values (WDS weights
# w1..w5, drift-severity formula, persistent-drift threshold, LRI latency
# budget) are explicitly not yet scientifically fixed. Inventing numbers now
# would bury arbitrary choices in a config file and make them look settled.
# Each is added in the phase that implements and justifies it.
reserved_for_later_phases:
  phase_2_models: "src/models/ -- edge/cloud hyperparameters, cost metadata"
  phase_3_drift_detection: "src/drift/ -- ADWIN delta, severity formula"
  phase_4_reliability: "src/reliability/ -- reliability inputs and weighting"
  phase_5_system: "src/network/, src/resources/ -- latency, bandwidth, CPU, LRI budget"
  phase_6_decision: "src/resources/wds.py -- w1..w5, argmin controller"
  phase_7_adaptation: "src/adaptation/ -- persistence threshold, retrain criteria"
  phase_8_baselines: "adaptation/baselines/ -- edge_only, cloud_only, hecif"
